# Email SMTP settings are now stored in the database (system_settings table)
# and configurable via the admin API. No spring.mail.* properties needed.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# Multipart Upload Settings (support up to 5MB files, 15MB total request size)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

# Supabase S3 Storage Properties
supabase.s3.endpoint=${SUPABASE_S3_ENDPOINT:}
supabase.s3.access-key=${SUPABASE_S3_ACCESS_KEY:}
supabase.s3.secret-key=${SUPABASE_S3_SECRET_KEY:}
supabase.s3.region=${SUPABASE_S3_REGION:us-east-1}
supabase.s3.bucket=${SUPABASE_S3_BUCKET:tradex-attachments}

# Suppress harmless third-party cookie formatting warnings (Cloudflare cookies)
logging.level.org.apache.http.client.protocol.ResponseProcessCookies=ERROR

# Spring Cache & Caffeine Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=expireAfterWrite=30s

