spring.application.name=backend
spring.profiles.active=dev
server.port=8080

# Common JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9
jwt.expiration=86400000

spring.threads.virtual.enabled=true

# TradeX Application Properties
tradex.otp.expiry-minutes=10
tradex.otp.max-attempts=3
tradex.otp.resend-cooldown-seconds=60

tradex.wallet.min-withdrawal-amount=100.00
tradex.wallet.max-withdrawal-amount=50000.00

tradex.seed.default-password=123456789
tradex.seed.welcome-bonus=1000

# Email SMTP settings are now stored in the database (system_settings table)
# and configurable via the admin API. No spring.mail.* properties needed.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
