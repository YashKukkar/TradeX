# Local Profile - Using H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:tradex;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Console for local debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Local attachment storage
tradex.storage.location=${TRADEX_STORAGE_LOCATION:./data/attachments}
tradex.storage.access-endpoint=${TRADEX_STORAGE_ACCESS_ENDPOINT:https://example.com/api/storage}
