<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0; padding:0; background-color:#f4f7fa; font-family:'Segoe UI',Roboto,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f7fa; padding:40px 20px;">
        <tr>
            <td align="center">
                <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,0.08); overflow:hidden;">
                    <!-- Header -->
                    <tr>
                        <td style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding:32px 40px; text-align:center;">
                            <h1 style="color:#ffffff; margin:0; font-size:28px; font-weight:700; letter-spacing:1px;">TradeX</h1>
                            <p style="color:rgba(255,255,255,0.85); margin:8px 0 0; font-size:14px;">Secure Verification</p>
                        </td>
                    </tr>
                    <!-- Body -->
                    <tr>
                        <td style="padding:40px;">
                            <h2 style="color:#1a1a2e; margin:0 0 16px; font-size:20px; font-weight:600;">Verification Code</h2>
                            <p style="color:#4a4a68; margin:0 0 24px; font-size:15px; line-height:1.6;">
                                Use the following code to complete your verification. This code is valid for <strong>{{expiryMinutes}} minutes</strong>.
                            </p>
                            <!-- OTP Box -->
                            <div style="background:#f8f9ff; border:2px dashed #667eea; border-radius:8px; padding:20px; text-align:center; margin:0 0 24px;">
                                <span style="font-size:36px; font-weight:700; letter-spacing:8px; color:#667eea; font-family:'Courier New',monospace;">{{otp}}</span>
                            </div>
                            <p style="color:#8888a0; margin:0; font-size:13px; line-height:1.5;">
                                If you did not request this code, please ignore this email. Do not share this code with anyone.
                            </p>
                        </td>
                    </tr>
                    <!-- Footer -->
                    <tr>
                        <td style="background-color:#f8f9ff; padding:20px 40px; text-align:center; border-top:1px solid #eef0f5;">
                            <p style="color:#aaaacc; margin:0; font-size:12px;">
                                &copy; 2026 TradeX. All rights reserved.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
